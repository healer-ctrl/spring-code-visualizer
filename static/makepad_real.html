<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Canvas - Real Project Scanner</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: #ccc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: auto; }
        
        #canvas {
            width: 10000px; height: 10000px; /* Huge area to scroll around */
            position: relative;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        header { position: fixed; top: 0; left: 0; right: 0; background-color: rgba(37, 37, 38, 0.95); padding: 10px 20px; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 15px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        header h1 { margin: 0; font-size: 16px; color: #fff; white-space: nowrap; }
        header input { background: #3c3c3c; border: 1px solid #555; color: #fff; padding: 6px 10px; border-radius: 4px; width: 250px; }
        header button { background-color: #0e639c; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; }
        header button:hover { background-color: #1177bb; }

        .code-window {
            position: absolute;
            width: 380px;
            height: 280px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        
        .code-window:hover { box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 50 !important; }

        .titlebar {
            background-color: #2d2d2d;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #dcb67a;
            cursor: grab;
            user-select: none;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e1e1e;
        }
        .titlebar:active { cursor: grabbing; }

        .editor-container { flex-grow: 1; position: relative; }
        .drag-shield { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; display: none; }

        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        path.connection { fill: none; stroke: #4A90E2; stroke-width: 2; opacity: 0.5; stroke-dasharray: 4,4; }
        
        #loading { position: fixed; top: 60px; left: 20px; color: #50E3C2; font-weight: bold; z-index: 1000; display: none; background: #252526; padding: 10px; border-radius: 4px; border: 1px solid #50E3C2; }
    </style>
</head>
<body>
    <header>
        <h1>Dynamic Makepad UI</h1>
        <input type="text" id="projectPath" value="demo-spring-project" placeholder="Path to project">
        <button onclick="scanAndRender()">Render Live Project</button>
        <button onclick="window.location.href='/'" style="background:#555;">Back</button>
    </header>

    <div id="loading">Scanning and initializing Monaco editors...</div>

    <div id="canvas">
        <svg id="svg-layer"></svg>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const svgLayer = document.getElementById('svg-layer');
        let connections = [];
        let edgesData = [];
        let nodesData = [];

        const groupColors = {
            Controller: '#4A90E2',
            Service: '#50E3C2',
            Repository: '#B8E986',
            DTO: '#F5A623',
            Entity: '#D0021B',
            Other: '#9B9B9B'
        };

        // --- Dragging Logic ---
        let draggedWin = null;
        let offsetX = 0, offsetY = 0;

        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.titlebar')) {
                draggedWin = e.target.closest('.code-window');
                document.querySelectorAll('.code-window').forEach(w => w.style.zIndex = 10);
                draggedWin.style.zIndex = 100;
                document.querySelectorAll('.drag-shield').forEach(s => s.style.display = 'block');
                const rect = draggedWin.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!draggedWin) return;
            const canvasRect = canvas.getBoundingClientRect();
            let newX = e.clientX - canvasRect.left - offsetX;
            let newY = e.clientY - canvasRect.top - offsetY;
            draggedWin.style.left = newX + 'px';
            draggedWin.style.top = newY + 'px';
            updateLines();
        });

        document.addEventListener('mouseup', () => {
            draggedWin = null;
            document.querySelectorAll('.drag-shield').forEach(s => s.style.display = 'none');
        });

        // --- Line Drawing Logic ---
        function updateLines() {
            connections.forEach(conn => {
                const w1 = document.getElementById(`win_${conn.from}`);
                const w2 = document.getElementById(`win_${conn.to}`);
                const path = document.getElementById(conn.pathId);
                
                if (!w1 || !w2 || !path) return;

                const x1 = parseInt(w1.style.left) + 380; // right edge
                const y1 = parseInt(w1.style.top) + 140;  // middle
                const x2 = parseInt(w2.style.left);       // left edge
                const y2 = parseInt(w2.style.top) + 140;
                
                const cp1x = x1 + 80;
                const cp2x = x2 - 80;
                
                path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
            });
        }

        async function scanAndRender() {
            document.getElementById('loading').style.display = 'block';
            
            // Clean up old elements
            document.querySelectorAll('.code-window').forEach(w => w.remove());
            svgLayer.innerHTML = '';
            connections = [];
            
            const path = document.getElementById('projectPath').value;
            try {
                const res = await fetch(`/api/architecture?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                
                if(data.error) {
                    alert(data.error);
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                nodesData = data.nodes;
                edgesData = data.edges;
                
                // Render HTML
                nodesData.forEach((node, i) => {
                    const win = document.createElement('div');
                    win.className = 'code-window';
                    win.id = `win_${node.id}`;
                    
                    // Basic layout math
                    let cols = 6;
                    let x = 100 + (i % cols) * 450;
                    let y = 150 + Math.floor(i / cols) * 350;
                    win.style.left = x + 'px';
                    win.style.top = y + 'px';
                    
                    let color = groupColors[node.group] || groupColors.Other;
                    
                    // Base64 encode code to prevent HTML injection issues
                    const safeCode = btoa(unescape(encodeURIComponent(node.content || '// No content')));

                    win.innerHTML = `
                        <div class="titlebar"><span style="color:${color}">📄 ${node.label}.java</span> <span>${node.group.toUpperCase()}</span></div>
                        <div class="editor-container">
                            <div class="drag-shield"></div>
                            <div id="editor_${node.id}" class="monaco-host" style="width:100%; height:100%;" data-code="${safeCode}"></div>
                        </div>
                    `;
                    canvas.appendChild(win);
                });

                // Render Edges
                edgesData.forEach((edge, i) => {
                    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    pathEl.className.baseVal = 'connection';
                    pathEl.id = `conn_${i}`;
                    svgLayer.appendChild(pathEl);
                    connections.push({ from: edge.from, to: edge.to, pathId: pathEl.id });
                });

                // Setup Monaco
                require(['vs/editor/editor.main'], function() {
                    document.querySelectorAll('.monaco-host').forEach(host => {
                        try {
                            const code = decodeURIComponent(escape(atob(host.getAttribute('data-code'))));
                            monaco.editor.create(host, { 
                                value: code, 
                                language: 'java', 
                                theme: 'vs-dark', 
                                minimap: { enabled: false },
                                scrollBeyondLastLine: false,
                                automaticLayout: true
                            });
                        } catch(e) { console.error('Monaco init error', e); }
                    });
                    
                    // Initial draw
                    setTimeout(() => { updateLines(); document.getElementById('loading').style.display = 'none'; }, 500);
                });
                
            } catch (err) {
                alert("Error fetching data: " + err);
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Initialize Monaco AMD loader
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        
        // Auto-run on load
        window.onload = scanAndRender;
    </script>
</body>
</html>
