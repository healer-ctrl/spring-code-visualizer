<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Canvas Code Editor (Makepad Style)</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: #ccc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* The infinite canvas */
        #canvas {
            width: 100vw; height: 100vh;
            position: relative;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        header { position: absolute; top: 0; left: 0; right: 0; background-color: #252526; padding: 15px; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; z-index: 1000; }
        header h1 { margin: 0; font-size: 16px; color: #fff; }

        /* Draggable Code Windows */
        .code-window {
            position: absolute;
            width: 450px;
            height: 350px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .titlebar {
            background-color: #2d2d2d;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #dcb67a;
            cursor: grab;
            user-select: none;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e1e1e;
        }
        
        .titlebar:active { cursor: grabbing; }

        .editor-container {
            flex-grow: 1;
            position: relative;
        }
        
        /* Drag shield to prevent Monaco from stealing mouse events during drag */
        .drag-shield {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; display: none;
        }

        /* Connecting SVG lines */
        #svg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        
        path.connection {
            fill: none; stroke: #4A90E2; stroke-width: 3; stroke-dasharray: 5,5;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>Infinite Canvas Editor (Visual Class Mapping)</h1>
        <button onclick="window.location.href='/'" style="background:#0e639c; color:white; border:none; padding:5px 15px; border-radius:4px; cursor:pointer;">Exit</button>
    </header>

    <svg id="svg-layer">
        <path id="line1" class="connection"></path>
        <path id="line2" class="connection"></path>
    </svg>

    <div id="canvas">
        
        <div class="code-window" id="win1" style="left: 100px; top: 150px;">
            <div class="titlebar"><span>📄 OrderController.java</span> <span>REST</span></div>
            <div class="editor-container">
                <div class="drag-shield"></div>
                <div id="editor1" style="width:100%; height:100%;"></div>
            </div>
        </div>

        <div class="code-window" id="win2" style="left: 650px; top: 250px;">
            <div class="titlebar"><span style="color:#50E3C2">📄 OrderService.java</span> <span>SERVICE</span></div>
            <div class="editor-container">
                <div class="drag-shield"></div>
                <div id="editor2" style="width:100%; height:100%;"></div>
            </div>
        </div>

        <div class="code-window" id="win3" style="left: 200px; top: 550px;">
            <div class="titlebar"><span style="color:#F5A623">📄 OrderRequestDTO.java</span> <span>DTO</span></div>
            <div class="editor-container">
                <div class="drag-shield"></div>
                <div id="editor3" style="width:100%; height:100%;"></div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script>
        // --- Dragging Logic ---
        let draggedWin = null;
        let offsetX = 0, offsetY = 0;

        document.querySelectorAll('.titlebar').forEach(bar => {
            bar.addEventListener('mousedown', (e) => {
                draggedWin = bar.parentElement;
                
                // Bring to front
                document.querySelectorAll('.code-window').forEach(w => w.style.zIndex = 10);
                draggedWin.style.zIndex = 100;

                // Show drag shields so editors don't eat mouse events
                document.querySelectorAll('.drag-shield').forEach(s => s.style.display = 'block');

                const rect = draggedWin.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (!draggedWin) return;
            draggedWin.style.left = (e.clientX - offsetX) + 'px';
            draggedWin.style.top = (e.clientY - offsetY) + 'px';
            updateLines();
        });

        document.addEventListener('mouseup', () => {
            draggedWin = null;
            document.querySelectorAll('.drag-shield').forEach(s => s.style.display = 'none');
        });

        // --- Line Drawing Logic ---
        function updateLines() {
            const drawCurve = (el1, el2, pathId) => {
                const r1 = el1.getBoundingClientRect();
                const r2 = el2.getBoundingClientRect();
                
                // From right side of win1 to left side of win2
                const x1 = r1.left + r1.width;
                const y1 = r1.top + (r1.height / 2);
                const x2 = r2.left;
                const y2 = r2.top + (r2.height / 2);
                
                const cp1x = x1 + 100;
                const cp2x = x2 - 100;
                
                document.getElementById(pathId).setAttribute('d', 
                    `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`
                );
            };

            const w1 = document.getElementById('win1');
            const w2 = document.getElementById('win2');
            const w3 = document.getElementById('win3');

            drawCurve(w1, w2, 'line1');
            
            // Draw curve from win1 bottom to win3 top
            const r1 = w1.getBoundingClientRect();
            const r3 = w3.getBoundingClientRect();
            const px1 = r1.left + 50;
            const py1 = r1.top + r1.height;
            const px2 = r3.left + 50;
            const py2 = r3.top;
            document.getElementById('line2').setAttribute('d', `M ${px1} ${py1} C ${px1} ${py1+50}, ${px2} ${py2-50}, ${px2} ${py2}`);
        }

        // --- Monaco Editor Logic ---
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            const code1 = `@RestController\n@RequestMapping("/api/orders")\npublic class OrderController {\n\n    private final OrderService orderService;\n\n    public OrderController(OrderService orderService) {\n        this.orderService = orderService;\n    }\n\n    @PostMapping\n    public ResponseEntity<?> createOrder(@RequestBody OrderRequestDTO request) {\n        var response = orderService.processOrder(request);\n        return ResponseEntity.ok(response);\n    }\n}`;
            const code2 = `@Service\npublic class OrderService {\n    \n    @Transactional\n    public OrderResponseDTO processOrder(OrderRequestDTO req) {\n        // 1. Validate request\n        // 2. Save to database\n        // 3. Trigger payment\n        return new OrderResponseDTO("SUCCESS");\n    }\n}`;
            const code3 = `public class OrderRequestDTO {\n    private String customerId;\n    private String productId;\n    private int quantity;\n\n    // Getters and Setters\n    public int getQuantity() {\n        return quantity;\n    }\n}`;

            monaco.editor.create(document.getElementById('editor1'), { value: code1, language: 'java', theme: 'vs-dark', minimap: { enabled: false }});
            monaco.editor.create(document.getElementById('editor2'), { value: code2, language: 'java', theme: 'vs-dark', minimap: { enabled: false }});
            monaco.editor.create(document.getElementById('editor3'), { value: code3, language: 'java', theme: 'vs-dark', minimap: { enabled: false }});
            
            updateLines();
        });
        
        // Handle window resize
        window.addEventListener('resize', updateLines);
    </script>
</body>
</html>
